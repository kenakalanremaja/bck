    <script type="text/javascript">
    (function() {
        // Tautan tujuan popunder
        var popunderUrl = "https://s.shopee.co.id/20wXcHM8CQ";
        var cookieName = "popunder_executed";

        function createPopunder() {
            // Cek apakah popunder sudah pernah muncul (menggunakan sessionStorage agar muncul 1x per sesi)
            if (sessionStorage.getItem(cookieName)) {
                return;
            }

            // Membuat window baru
            var popWindow = window.open(popunderUrl, '_blank', 'width=1000,height=800,scrollbars=yes,resizable=yes');

            if (popWindow) {
                // Mencoba memindahkan window baru ke latar belakang (popunder)
                popWindow.blur();
                window.focus();
                
                // Set session agar tidak muncul terus-menerus di setiap klik
                sessionStorage.setItem(cookieName, "true");
            }
        }

        // Memicu popunder saat ada interaksi pertama dari pengguna di halaman
        document.addEventListener('click', function() {
            createPopunder();
        }, { once: true }); // '{ once: true }' memastikan event listener hanya berjalan sekali
    })();
</script>
